version: "3.8"

services:
  # ==============================================================================
  # Evolution API v2 (Conector Oficial WhatsApp via QR Code)
  # ==============================================================================
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: hermes-evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${WHATSAPP_API_TOKEN:-hermes_evolution_token_secret_123}
      DATABASE_ENABLED: "false"
      REDIS_ENABLED: "true"
      REDIS_URI: redis://evolution-redis:6379
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      LOG_LEVEL: ERROR,WARN,INFO
      CONFIG_SESSION_PHONE_CLIENT: "Hermes Voice Memory"
    depends_on:
      - evolution-redis
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - hermes-homelab-net

  # ==============================================================================
  # Redis (Cache e fila para a Evolution API)
  # ==============================================================================
  evolution-redis:
    image: redis:7-alpine
    container_name: hermes-evolution-redis
    restart: unless-stopped
    volumes:
      - evolution_redis_data:/data
    networks:
      - hermes-homelab-net

  # ==============================================================================
  # n8n (Motor Visual de Automação & Workflows)
  # ==============================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: hermes-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Sao_Paulo
      HERMES_API_URL: http://host.docker.internal:8000
      WHATSAPP_API_ENDPOINT: http://evolution-api:8080/message/sendText/hermes
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-hermes_evolution_token_secret_123}
      ADMIN_WHATSAPP_NUMBER: ${ADMIN_WHATSAPP_NUMBER:-5544999999999}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - evolution-api
    networks:
      - hermes-homelab-net

volumes:
  evolution_instances:
    name: hermes_evolution_instances
  evolution_redis_data:
    name: hermes_evolution_redis_data
  n8n_data:
    name: hermes_n8n_data

networks:
  hermes-homelab-net:
    name: hermes_homelab_network
    driver: bridge
