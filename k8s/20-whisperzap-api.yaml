apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisperzap-api
  namespace: whisperzap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisperzap-api
  template:
    metadata:
      labels:
        app: whisperzap-api
    spec:
      containers:
        - name: whisperzap-api
          image: brunocorisco/whisperzap:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: whisperzap-config
            - secretRef:
                name: whisperzap-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: whisperzap-api
  namespace: whisperzap
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: whisperzap-api
