name: CI - Testes Automatizados & Qualidade de Código

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Pytest & Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Executar Testes Unitários e Filtros Semânticos
        env:
          ENVIRONMENT: "testing"
          AI_PROVIDER: "mock"
          EMBEDDING_PROVIDER: "mock"
        run: |
          pytest tests/test_bypass_and_owner_filter.py tests/test_ai_gateway.py tests/test_contacts_service.py -v
